<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Form đăng ký</title>
    <link rel="stylesheet" href="ex_02_1.css">
</head>
<body>
    <h2>Đăng ký tài khoản</h2>
    <form id = "input_form">
        <div>
            <label>Họ và tên</label>
            <input type="text" id="name">
            <small class = "error" id = "name_error"></small>
        </div>

        <div>
            <label>Email</label>
            <input type="email" id="email">
            <span class = "error" id = "email_error"></span>
        </div>

        <div>
            <label>Số điện thoại</label>
            <input type="tel" id="phone">
            <span class = "error" id = "phone_error"></span>
        </div>

        <div>
            <label>Mật khẩu</label>
            <input type="password" id="password">
            <span class = "error" id = "password_error"></span>
        </div>

        <div>
            <label>Xác nhận mật khẩu</label>
            <input type="password" id="confirm_pass">
            <span class = "error" id = "confirmPass_error"></span>
        </div>

        <div>
            <label>Giới tính</label>
            <input type="radio" name = "gender" value = "Nam">Nam
            <input type="radio" name = "gender" value = "Nữ">Nữ
            <span class = "error" id = "gender_error"></span>
        </div>
        
        <div>
            <input type="checkbox" id = "term">Đồng ý điều khoản
            <span class = "error" id = "term_error"></span>
        </div>

        <button type = "submit">Đăng ký</button>
    </form>
    
    <div id = "success"></div>

    <script src = "ex_02_1.js"></script>
    
</body>
</html>
